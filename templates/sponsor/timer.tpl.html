<!doctype html>
<!-- Sponsor mid-roll with a "back to the video in m:ss" countdown.
     Copy to <project>/mg_sponsor/index.html, put the sponsor clip at assets/sponsor.mp4 and replace
     __DUR__ (clip length in seconds, e.g. 136.7) everywhere. Only for a mid-roll inside a normal video;
     a fully sponsored video does not use this. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;font-family:Inter;overflow:hidden}
#sp{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:contain}
#timer{position:absolute;right:48px;top:44px;z-index:5;display:flex;align-items:center;gap:18px;padding:14px 26px 14px 16px;border-radius:999px;background:rgba(8,9,14,.78);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.45)}
#timer .lbl{font:600 22px Inter;color:#c9cbe0;letter-spacing:.01em}
#timer .num{font:800 30px "JetBrains Mono";color:#fff;min-width:92px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080">
  <video id="sp" class="clip" src="assets/sponsor.mp4" data-has-audio="true" data-start="0" data-duration="__DUR__" data-track-index="0"></video>
  <div id="timer" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1">
    <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" stroke="rgba(255,255,255,.15)" stroke-width="6" fill="none"/><circle id="arc" cx="26" cy="26" r="21" stroke="#c6f432" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="131.95" stroke-dashoffset="0" transform="rotate(-90 26 26)"/></svg>
    <div><div class="lbl">Sponsored · back to the video in</div></div>
    <div class="num" id="num"></div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const D = __DUR__, o = {v:0};
tl.from("#timer > *", {opacity:0, x:20, duration:0.5, stagger:0.06, ease:"power3.out"}, 0.6);
tl.to("#arc", {strokeDashoffset:131.95, duration:D, ease:"none"}, 0);
tl.to(o, {v:D, duration:D, ease:"none", onUpdate:()=>{ const r = Math.max(0, Math.ceil(D - o.v)); document.getElementById("num").textContent = Math.floor(r/60)+":"+String(r%60).padStart(2,"0"); }}, 0);
tl.to("#timer", {opacity:0, duration:0.4}, D - 0.5);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
